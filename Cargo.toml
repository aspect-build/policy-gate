[package]
name = "policy-gate"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Continuous admission and active-stream enforcement driven by an external policy source"
repository = "https://github.com/aspect-build/policy-gate"
license = "Apache-2.0"
keywords = ["authorization", "middleware", "policy", "tower"]
categories = ["asynchronous", "authentication", "network-programming"]
publish = false

[lib]
doctest = false
test = false

[features]
default = ["tokio", "tonic-client", "tonic-layer", "axum-body"]
axum-body = ["dep:axum-core", "tower-layer"]
tonic-client = [
  "dep:prost",
  "dep:tonic",
  "tonic/channel",
  "tonic/codegen",
  "tonic/prost",
]
tokio = ["tokio/rt", "tokio/time"]
tower-layer = [
  "dep:bytes",
  "dep:http",
  "dep:http-body",
  "dep:pin-project",
  "dep:tower",
]
tonic-layer = ["tower-layer", "dep:tonic"]

[dependencies]
arc-swap = { version = "1.7.1", default-features = false }
async-watch = { version = "0.3.1", default-features = false }
axum-core = { version = "0.5.2", default-features = false, optional = true }
bytes = { version = "1.10.1", default-features = false, optional = true }
futures-core = { version = "0.3.31", default-features = false }
futures-util = { version = "0.3.31", default-features = false, features = ["async-await-macro", "std"] }
http = { version = "1.3.1", default-features = false, optional = true }
http-body = { version = "1.0.1", default-features = false, optional = true }
lru = { version = "0.16.3", default-features = false }
parking_lot = { version = "0.12.3", default-features = false }
pin-project = { version = "1.1.10", optional = true }
prost = { version = "0.13.5", default-features = false, features = ["derive"], optional = true }
rand = { version = "0.9.0", default-features = false, features = ["thread_rng"] }
tokio = { version = "1.44.1", default-features = false, features = ["sync"] }
tonic = { version = "0.13.0", default-features = false, optional = true }
tower = { version = "0.5.2", default-features = false, optional = true }
tracing = { version = "0.1.41", default-features = false }
triomphe = { version = "0.1.16", default-features = false }

[dev-dependencies]
axum = { version = "0.8.4", default-features = false, features = ["http1", "tokio"] }
http-body-util = { version = "0.1.3", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
tokio = { version = "1.44.1", default-features = false, features = ["macros", "sync", "test-util"] }
tokio-stream = { version = "0.1.17", default-features = false }
tower = { version = "0.5.2", default-features = false, features = ["util"] }
uuid = { version = "1.16.0", default-features = false }

[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["axum-body", "tokio", "tonic-client", "tonic-layer"]

[[example]]
name = "http_middleware"
required-features = ["axum-body", "tokio"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
